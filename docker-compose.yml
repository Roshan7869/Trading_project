services:
  # Database Service
  mongo:
    image: mongo:latest
    container_name: trading-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - trading-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Cache & Pub/Sub Service
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Backend Service (Development Mode)
  backend:
    build:
      context: ./backend-express
      dockerfile: Dockerfile.dev
    container_name: trading-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./backend-express/src:/app/src:delegated
      - ./backend-express/package.json:/app/package.json:ro
      - ./backend-express/nodemon.json:/app/nodemon.json:ro
      - ./backend-express/tsconfig.json:/app/tsconfig.json:ro
      - backend_node_modules:/app/node_modules
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PORT=4000
      - NODE_ENV=development
      - MONGO_URL=mongodb://mongo:27017/paper_trading
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - TEST_MODE=false
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - YFINANCE_API_URL=http://yfinance-api:5001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trading-net

  # Data Engine Service (YFinance Mode - No Broker API)
  data-engine:
    build:
      context: ./data-engine
      dockerfile: Dockerfile.dev
    container_name: trading-data-engine
    restart: unless-stopped
    volumes:
      - ./data-engine:/app:delegated
      - data_engine_cache:/root/.cache
    command: python -u market_simulator.py --mode=yfinance
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - MONGO_URL=mongodb://mongo:27017/paper_trading
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-net

  # YFinance Stock API Service
  yfinance-api:
    build:
      context: ./data-engine
      dockerfile: Dockerfile.dev
    container_name: trading-yfinance-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./data-engine:/app:delegated
    command: python -u yfinance_api.py
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - MONGO_URL=mongodb://mongo:27017/paper_trading
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-net

  # Strategy Engine Service
  strategy-engine:
    build:
      context: ./data-engine
      dockerfile: Dockerfile.dev
    container_name: trading-strategy-engine
    restart: unless-stopped
    volumes:
      - ./data-engine:/app:delegated
      - strategy_engine_cache:/root/.cache
    command: python -u strategy_engine.py
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - MONGO_URL=mongodb://mongo:27017/paper_trading
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-net

  # Frontend Service (Development Mode with Turbopack)
  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: trading-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-nextjs/app:/app/app:delegated
      - ./frontend-nextjs/components:/app/components:delegated
      - ./frontend-nextjs/context:/app/context:delegated
      - ./frontend-nextjs/hooks:/app/hooks:delegated
      - ./frontend-nextjs/lib:/app/lib:delegated
      - ./frontend-nextjs/public:/app/public:delegated
      - ./frontend-nextjs/next.config.js:/app/next.config.js:ro
      - ./frontend-nextjs/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./frontend-nextjs/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend-nextjs/tsconfig.json:/app/tsconfig.json:ro
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trading-net
    stdin_open: true
    tty: true

volumes:
  mongo_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
  data_engine_cache:
  strategy_engine_cache:

networks:
  trading-net:
    driver: bridge
