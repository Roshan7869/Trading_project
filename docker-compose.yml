services:
  # Database Service
  mongo:
    image: mongo:latest
    container_name: trading-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - trading-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Cache & Pub/Sub Service
  redis:
    image: redis:latest
    container_name: trading-redis
    ports:
      - "6379:6379"
    networks:
      - trading-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build: ./backend-express
    container_name: trading-backend
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./backend-express:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    command: npm run dev
    env_file:
      - .env
    environment:
      - PORT=4000
      - MONGO_URL=mongodb://mongo:27017/paper_trading
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
      - TEST_MODE=false
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net

  # Data Engine Service
  data-engine:
    build: ./data-engine
    container_name: trading-data-engine
    restart: always
    volumes:
      - ./data-engine:/app
    # Using default CMD from Dockerfile is fine for python, but mounting lets us restart to see changes
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-net

  # Frontend Service
  frontend:
    build:
      context: ./frontend-nextjs
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: trading-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend
    networks:
      - trading-net

volumes:
  mongo_data:


networks:
  trading-net:
    driver: bridge
